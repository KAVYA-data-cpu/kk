<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>sorryyyyyyyyy ràk 🩷</title>
  <meta name="description" content="A personal, heartfelt interactive apology card." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink-deep: hsl(340, 60%, 60%);
      --card-border: rgba(255,255,255,0.38);
      --card-bg: rgba(255,240,248,0.22);
    }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      font-family: 'Lato', sans-serif;
    }

    /* ─── BACKGROUND ─────────────────────────────────────── */
    #bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      background: linear-gradient(140deg,
        hsl(330,70%,94%) 0%, hsl(300,60%,95%) 40%,
        hsl(340,80%,97%) 70%, hsl(280,50%,95%) 100%);
    }
    .bg-orb {
      position: absolute; border-radius: 50%;
      filter: blur(70px); opacity: 0.45;
      animation: orb-drift 14s ease-in-out infinite alternate;
    }
    .bg-orb:nth-child(1){width:380px;height:380px;background:hsl(340,80%,84%);top:-80px;left:-80px;animation-duration:16s}
    .bg-orb:nth-child(2){width:280px;height:280px;background:hsl(280,60%,85%);bottom:-60px;right:-60px;animation-duration:18s}
    .bg-orb:nth-child(3){width:200px;height:200px;background:hsl(340,60%,90%);top:40%;left:60%;animation-duration:12s}
    @keyframes orb-drift {
      from { transform:translate(0,0) scale(1); }
      to   { transform:translate(30px,20px) scale(1.08); }
    }

    #bg-hearts { position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden; }
    .bg-heart {
      position:absolute;opacity:0;user-select:none;
      animation:bg-heart-float linear infinite;
    }
    @keyframes bg-heart-float {
      0%   { transform:translateY(110vh) scale(0.6);opacity:0; }
      10%  { opacity:0.35; }
      90%  { opacity:0.28; }
      100% { transform:translateY(-10vh) scale(1.1);opacity:0; }
    }

    /* ─── APP ─────────────────────────────────────────────── */
    #app {
      position:relative;z-index:1;
      height:100dvh;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:12px 16px;
    }

    /* ─── MUSIC BUTTON ────────────────────────────────────── */
    #music-btn {
      position:fixed;top:16px;right:16px;z-index:100;
      background:rgba(255,255,255,0.35);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.5);
      border-radius:50%;width:44px;height:44px;
      font-size:18px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 16px rgba(200,100,140,0.2);
      transition:transform 0.2s,box-shadow 0.2s;
    }
    #music-btn:hover{transform:scale(1.1);box-shadow:0 6px 22px rgba(200,100,140,0.3);}
    #music-btn.playing{animation:spin-slow 3s linear infinite;}
    @keyframes spin-slow{to{transform:rotate(360deg);}}
    #music-file{display:none;}

    /* ─── CARD ────────────────────────────────────────────── */
    #card {
      position:relative;
      width:100%;max-width:420px;
      height:calc(100dvh - 80px);max-height:780px;
      border-radius:28px;
      border:1px solid var(--card-border);
      box-shadow:
        0 8px 32px rgba(200,80,140,0.18),
        0 0 0 1px rgba(255,255,255,0.2),
        inset 0 1px 0 rgba(255,255,255,0.4);
      overflow:hidden;
      background:var(--card-bg);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      animation:card-in 1.1s cubic-bezier(0.22,1,0.36,1) both, card-float 5s ease-in-out 1.2s infinite;
      transition:box-shadow 0.6s ease;
      margin-top:28px;
    }
    #card.glowing{
      box-shadow:
        0 8px 40px rgba(200,80,140,0.35),
        0 0 70px rgba(255,160,200,0.4),
        0 0 0 1px rgba(255,255,255,0.3);
    }
    @keyframes card-in{
      from{opacity:0;transform:scale(0.9) translateY(28px);}
      to{opacity:1;transform:scale(1) translateY(0);}
    }
    @keyframes card-float{
      0%,100%{transform:translateY(0);}
      50%{transform:translateY(-7px);}
    }

    /* Photo — fills entire card as background */
    #card-photo{
      position:absolute;inset:0;
      width:100%;height:100%;
      object-fit:cover;
      display:none;z-index:0;
    }
    #card-photo.loaded{display:block;}

    /* Overlay */
    #card-overlay{
      position:absolute;inset:0;z-index:1;
      background:rgba(255,230,242,0.15);
      transition:background 0.7s ease;
      pointer-events:none;
    }
    #card.has-photo #card-overlay{
      background:linear-gradient(
        160deg,
        rgba(20,5,15,0.42) 0%,
        rgba(160,40,90,0.35) 45%,
        rgba(10,2,8,0.62) 100%
      );
    }

    /* Corner dots */
    .card-corner{
      position:absolute;z-index:2;
      width:10px;height:10px;border-radius:50%;
      background:rgba(255,255,255,0.6);
      box-shadow:0 0 8px rgba(255,180,210,0.9);
    }
    .card-corner.tl{top:14px;left:14px;}
    .card-corner.tr{top:14px;right:14px;}
    .card-corner.bl{bottom:14px;left:14px;}
    .card-corner.br{bottom:14px;right:14px;}

    /* Content above overlay */
    #card-content{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;}

    /* ─── INITIAL SCREEN ──────────────────────────────────── */
    #initial-screen{
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:32px 28px;text-align:center;
    }
    .title-main{
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(2rem,7vw,2.8rem);
      font-weight:500;color:var(--pink-deep);
      letter-spacing:0.02em;line-height:1.2;
      margin-bottom:10px;
      text-shadow:0 2px 20px rgba(200,80,140,0.25);
    }
    .title-sub{
      font-size:clamp(0.85rem,3vw,0.95rem);
      color:hsl(330,15%,42%);font-weight:300;
      margin-bottom:36px;letter-spacing:0.05em;
    }
    .btn-primary{
      display:inline-flex;align-items:center;gap:8px;
      background:linear-gradient(135deg,hsl(340,65%,72%),hsl(280,55%,72%));
      color:#fff;border:none;border-radius:50px;
      padding:14px 30px;
      font-size:clamp(0.9rem,3.5vw,1rem);font-family:'Lato',sans-serif;
      font-weight:400;letter-spacing:0.04em;cursor:pointer;
      box-shadow:0 4px 20px rgba(200,80,140,0.3);
      transition:transform 0.2s,box-shadow 0.2s;
    }
    .btn-primary:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 28px rgba(200,80,140,0.4);}
    .btn-primary:active{transform:scale(0.97);}

    /* ─── OPENED HEADER ───────────────────────────────────── */
    #card-header{display:none;flex-shrink:0;padding:20px 22px 8px;text-align:center;}
    #card-header.visible{display:block;}
    .card-title{
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(1.3rem,5vw,1.7rem);
      font-weight:500;color:#fff;
      text-shadow:0 2px 12px rgba(0,0,0,0.5);
      letter-spacing:0.02em;
    }

    /* Add photo bar */
    #photo-upload-bar{
      display:none;flex-shrink:0;
      align-items:center;justify-content:center;
      padding:6px 20px 0;
    }
    #photo-upload-bar.visible{display:flex;}
    #add-photo-btn{
      background:rgba(255,255,255,0.22);
      backdrop-filter:blur(8px);
      border:1px dashed rgba(255,255,255,0.55);
      border-radius:24px;
      color:rgba(255,255,255,0.9);
      font-size:0.78rem;letter-spacing:0.06em;
      padding:7px 16px;cursor:pointer;
      transition:background 0.2s;
    }
    #add-photo-btn:hover{background:rgba(255,255,255,0.32);}
    #photo-file{display:none;}

    /* ─── MESSAGE AREA — scrolls over photo ──────────────── */
    #message-section{
      display:none;flex:1;
      overflow-y:auto;overflow-x:hidden;
      padding:12px 22px 18px;
      scrollbar-width:thin;
      scrollbar-color:rgba(255,255,255,0.3) transparent;
    }
    #message-section::-webkit-scrollbar{width:3px;}
    #message-section::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.3);border-radius:4px;}
    #message-section.open{display:block;}

    .divider{
      width:50px;height:1px;margin:10px auto 14px;
      background:linear-gradient(to right,transparent,rgba(255,255,255,0.45),transparent);
    }

    .message-text{
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(1rem,3.8vw,1.12rem);
      font-weight:400;line-height:1.9;
      color:#fff;
      text-shadow:0 1px 6px rgba(0,0,0,0.45);
      word-break:break-word;
    }
    .msg-para{
      display:block;margin-bottom:18px;
      opacity:0;transform:translateY(10px);
      transition:opacity 0.7s ease,transform 0.7s ease;
    }
    .msg-para.revealed{opacity:1;transform:translateY(0);}
    /* instant reveal (no animation) on page restore */
    .msg-para.instant{transition:none;opacity:1;transform:translateY(0);}

    .sorry-line{
      display:block;
      color:hsl(340,90%,85%);
      font-style:italic;font-weight:500;letter-spacing:0.01em;
      text-shadow:0 1px 8px rgba(0,0,0,0.5);
    }

    /* ─── SINCERE SECTION ─────────────────────────────────── */
    #sincere-section{display:none;flex-shrink:0;padding:0 22px 20px;text-align:center;}
    #sincere-section.visible{display:block;}
    .btn-sincere{
      display:inline-flex;align-items:center;gap:8px;
      background:rgba(255,255,255,0.18);
      backdrop-filter:blur(10px);
      color:#fff;
      border:1.5px solid rgba(255,255,255,0.45);border-radius:50px;
      padding:12px 26px;
      font-size:clamp(0.88rem,3.5vw,0.98rem);font-family:'Lato',sans-serif;
      font-weight:400;letter-spacing:0.04em;cursor:pointer;
      box-shadow:0 4px 18px rgba(0,0,0,0.18);
      transition:transform 0.2s,background 0.3s,box-shadow 0.2s;
    }
    .btn-sincere:hover{transform:translateY(-2px);background:rgba(255,255,255,0.28);box-shadow:0 8px 26px rgba(0,0,0,0.22);}

    /* ─── FLOATING HEARTS ─────────────────────────────────── */
    .float-heart{
      position:fixed;pointer-events:none;user-select:none;
      animation:fh-rise 3s ease-out forwards;z-index:200;
    }
    @keyframes fh-rise{
      0%{transform:translateY(0) scale(0.5);opacity:0;}
      20%{opacity:1;}
      100%{transform:translateY(-55vh) scale(1.2);opacity:0;}
    }
    .burst-heart{
      position:fixed;pointer-events:none;font-size:18px;user-select:none;
      animation:burst-out 0.9s ease-out forwards;z-index:201;
    }
    @keyframes burst-out{
      0%{transform:translate(-50%,-50%) scale(0.4);opacity:1;}
      100%{transform:translate(calc(-50% + var(--bx)),calc(-50% + var(--by))) scale(1.1);opacity:0;}
    }

    @media(max-width:380px){
      #message-section{padding:10px 16px 16px;}
      #card-header{padding:16px 16px 6px;}
      #sincere-section{padding:0 16px 16px;}
    }
  </style>
</head>
<body>

<div id="bg">
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
</div>
<div id="bg-hearts"></div>

<button id="music-btn" title="Add / play music">🎵</button>
<input type="file" id="music-file" accept="audio/*" />
<audio id="bg-audio" loop></audio>

<div id="app">
  <div id="card">
    <img id="card-photo" alt="our photo" />
    <div id="card-overlay"></div>
    <div class="card-corner tl"></div>
    <div class="card-corner tr"></div>
    <div class="card-corner bl"></div>
    <div class="card-corner br"></div>

    <div id="card-content">

      <!-- INITIAL SCREEN -->
      <div id="initial-screen">
        <p class="title-main">sorryyyyyyyyy ràk 🩷</p>
        <p class="title-sub">tap to open something for you</p>
        <button class="btn-primary" id="open-btn">Read my message 💌</button>
      </div>

      <!-- OPENED HEADER -->
      <div id="card-header">
        <p class="card-title">sorryyyyyyyyy ràk 🩷</p>
      </div>

      <!-- Add photo (disappears once photo locked) -->
      <div id="photo-upload-bar">
        <button id="add-photo-btn">📷 Add our photo</button>
        <input type="file" id="photo-file" accept="image/*" />
      </div>

      <!-- Message scrolls over photo -->
      <div id="message-section">
        <div class="divider"></div>
        <div class="message-text" id="message-content"></div>
        <div class="divider" style="margin-top:4px;"></div>
      </div>

      <!-- Sincere button -->
      <div id="sincere-section">
        <button class="btn-sincere" id="sincere-btn">I really mean it 🥺</button>
      </div>

    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   MESSAGE PARAGRAPHS — EXACT TEXT, DO NOT MODIFY
═══════════════════════════════════════════════════════════ */
const MESSAGE_PARAGRAPHS = [
  " sorryyyyyyyyy ràk 🩷",
  "naki ardam ayithanledu nen em chesnano kani ardam ayithandi feel ayinav ani sorryyy. enduku nak fark padadu ani anukuntanav. padthadi ,nuvu anukunna danikante ekkuve padthadi .",
  "naki ninna nuvu message cheyyadu anepatiki eyes lo water vochesnayi. nenu undaleka pothanna kousar tala nosthandi .",
  "nene monna anna intrest ledu ani sorry kani kopam lo anesna etla kavalante atla behave chesthanna kada ,sare apkunta try chestha sorry ràkkkk.",
  "nen em ninni unfollow kavala ani cheyyale edo ayindi chala ante chala badesindi ,nijam cheppalante nen unfollow chesna ani nik telsde 3 or 4 days tharvtha adi chusi nuvu unfollow chesnav ani kuda telsu . kanisam okkasari kuda adagala ani pileda.",
  "tarvtha nuvu send chesna half hour ke nen react ayina kani nuvu chuskolee 7 hours naki gurthundi baga.andyke unsend chesna ,nen em ninni seen lo vodhileyy nuvee nanni sent vodilesnav .",
  "nik farak padna lekpoena nen vodhiley lenu ,nijamgane change kalenu. enka nen conscious lo unde behave chestha try chestha.",
  "sorryyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy\nsorryyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy\nsorryyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy\nsorryyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy\nsorryyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy."
];

/* ═══════════════════════════════════════════════════════════
   INDEXEDDB — audio blob storage
═══════════════════════════════════════════════════════════ */
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('apology-card-db', 1);
    r.onupgradeneeded = e => e.target.result.createObjectStore('assets');
    r.onsuccess = e => res(e.target.result);
    r.onerror   = e => rej(e.target.error);
  });
}
function dbGet(db, key) {
  return new Promise((res, rej) => {
    const r = db.transaction('assets','readonly').objectStore('assets').get(key);
    r.onsuccess = e => res(e.target.result);
    r.onerror   = e => rej(e.target.error);
  });
}
function dbPut(db, key, val) {
  return new Promise((res, rej) => {
    const r = db.transaction('assets','readwrite').objectStore('assets').put(val, key);
    r.onsuccess = () => res();
    r.onerror   = e => rej(e.target.error);
  });
}

/* ═══════════════════════════════════════════════════════════
   BACKGROUND HEARTS
═══════════════════════════════════════════════════════════ */
(function () {
  const c = document.getElementById('bg-hearts');
  const emojis = ['🩷','💗','💕','💖','🌸'];
  function spawn() {
    const el = document.createElement('span');
    el.className = 'bg-heart';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    const dur = 9 + Math.random() * 10;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay   = Math.random() * 4 + 's';
    el.style.fontSize         = (10 + Math.random() * 12) + 'px';
    c.appendChild(el);
    setTimeout(() => el.remove(), (dur + 5) * 1000);
  }
  for (let i = 0; i < 12; i++) setTimeout(spawn, i * 800);
  setInterval(spawn, 1800);
})();

/* ═══════════════════════════════════════════════════════════
   MUSIC — upload once → IndexedDB → locked forever
═══════════════════════════════════════════════════════════ */
let musicLocked = false, audioPlaying = false;
const musicBtn  = document.getElementById('music-btn');
const bgAudio   = document.getElementById('bg-audio');
const musicFile = document.getElementById('music-file');

async function initMusic() {
  try {
    const db   = await openDB();
    const blob = await dbGet(db, 'music');
    if (blob) {
      bgAudio.src = URL.createObjectURL(blob);
      musicLocked = true;
      musicBtn.title = 'Play / Pause music';
      // NOTE: cannot auto-play on refresh due to browser policy
      // User presses 🎵 to play
    }
  } catch(e) {}
}
musicBtn.addEventListener('click', async () => {
  if (!musicLocked) { musicFile.click(); return; }
  if (!audioPlaying) {
    bgAudio.play().then(() => {
      audioPlaying = true;
      musicBtn.classList.add('playing');
      musicBtn.textContent = '🎶';
    }).catch(() => {});
  } else {
    bgAudio.pause();
    audioPlaying = false;
    musicBtn.classList.remove('playing');
    musicBtn.textContent = '🎵';
  }
});
musicFile.addEventListener('change', async (e) => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const db = await openDB();
    await dbPut(db, 'music', file);
    bgAudio.src = URL.createObjectURL(file);
    musicLocked = true;
    musicFile.value = '';
    musicBtn.title = 'Play / Pause music';
    bgAudio.play().then(() => {
      audioPlaying = true;
      musicBtn.classList.add('playing');
      musicBtn.textContent = '🎶';
    }).catch(() => {});
  } catch(e) {}
});

/* ═══════════════════════════════════════════════════════════
   PHOTO — base64 in localStorage, locked forever
═══════════════════════════════════════════════════════════ */
let photoLocked = false;

function applyPhoto(dataUrl) {
  const img  = document.getElementById('card-photo');
  const card = document.getElementById('card');
  const bar  = document.getElementById('photo-upload-bar');
  img.src = dataUrl;
  img.onload = () => {
    img.classList.add('loaded');
    card.classList.add('has-photo');
    bar.style.display = 'none';
    photoLocked = true;
  };
}

(function photoUpload() {
  const addBtn    = document.getElementById('add-photo-btn');
  const fileInput = document.getElementById('photo-file');
  addBtn.addEventListener('click', () => { if (!photoLocked) fileInput.click(); });
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file || photoLocked) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const tmpImg = new Image();
      tmpImg.onload = () => {
        const MAX = 1000;
        let w = tmpImg.width, h = tmpImg.height;
        if (w > MAX || h > MAX) {
          const ratio = Math.min(MAX/w, MAX/h);
          w = Math.round(w*ratio); h = Math.round(h*ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(tmpImg, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        try { localStorage.setItem('apology-card-photo', dataUrl); } catch(err) {}
        applyPhoto(dataUrl);
      };
      tmpImg.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });
})();

/* ═══════════════════════════════════════════════════════════
   BUILD MESSAGE DOM (shared by animate & instant restore)
═══════════════════════════════════════════════════════════ */
function buildMessageDOM() {
  const container = document.getElementById('message-content');
  if (container.children.length > 0) return; // already built
  MESSAGE_PARAGRAPHS.forEach((text, i) => {
    const span = document.createElement('span');
    span.className = 'msg-para';
    if (i === MESSAGE_PARAGRAPHS.length - 1) {
      text.split('\n').forEach((line, li, arr) => {
        const ls = document.createElement('span');
        ls.className   = 'sorry-line';
        ls.textContent = line;
        span.appendChild(ls);
        if (li < arr.length - 1) span.appendChild(document.createElement('br'));
      });
    } else {
      span.textContent = text;
    }
    container.appendChild(span);
  });
}

/* ═══════════════════════════════════════════════════════════
   OPEN CARD UI (shared helper)
═══════════════════════════════════════════════════════════ */
function openCardUI() {
  document.getElementById('initial-screen').style.display  = 'none';
  document.getElementById('card-header').classList.add('visible');
  document.getElementById('message-section').classList.add('open');
  // Show add-photo bar only if no photo yet
  const savedPhoto = localStorage.getItem('apology-card-photo');
  if (!savedPhoto) {
    document.getElementById('photo-upload-bar').classList.add('visible');
  }
}

/* ═══════════════════════════════════════════════════════════
   RESTORE STATE ON REFRESH
   — if card was previously opened, skip intro & show everything
═══════════════════════════════════════════════════════════ */
// restoreState removed — initial screen always shows first on load

/* ═══════════════════════════════════════════════════════════
   OPEN BUTTON (first time)
═══════════════════════════════════════════════════════════ */
document.getElementById('open-btn').addEventListener('click', function () {
  const card = document.getElementById('card');
  card.style.animation = 'none';
  openCardUI();

  // Restore photo if already added
  const savedPhoto = localStorage.getItem('apology-card-photo');
  if (savedPhoto) applyPhoto(savedPhoto);

  // Auto-play music — this click is a valid user gesture so browser allows it
  if (musicLocked && !audioPlaying) {
    bgAudio.play().then(() => {
      audioPlaying = true;
      musicBtn.classList.add('playing');
      musicBtn.textContent = '🎶';
    }).catch(() => {});
  }

  setTimeout(() => {
    card.style.animation = 'card-float 5s ease-in-out infinite';
  }, 700);

  startMessageReveal();
});

/* ═══════════════════════════════════════════════════════════
   MESSAGE REVEAL ANIMATION (first open only)
═══════════════════════════════════════════════════════════ */
function startMessageReveal() {
  buildMessageDOM();
  const scroller = document.getElementById('message-section');
  const paras    = document.querySelectorAll('.msg-para');
  let delay = 500;
  paras.forEach((para, i) => {
    const isLast = i === paras.length - 1;
    setTimeout(() => {
      para.classList.add('revealed');
      setTimeout(() => {
        scroller.scrollTo({ top: scroller.scrollHeight, behavior: 'smooth' });
      }, 150);
      if (isLast) setTimeout(finalSorryAnimation, 1400);
    }, delay);
    delay += isLast ? 1000 : 1500;
  });
}

/* ═══════════════════════════════════════════════════════════
   FINAL HEARTS + SINCERE BUTTON
═══════════════════════════════════════════════════════════ */
function finalSorryAnimation() {
  const emojis = ['🩷','💗','💕','💖'];
  const card   = document.getElementById('card');
  let count = 0;
  function spawnHeart() {
    if (count >= 22) {
      document.getElementById('sincere-section').classList.add('visible');
      return;
    }
    const el = document.createElement('span');
    el.className   = 'float-heart';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const r = card.getBoundingClientRect();
    el.style.left     = (r.left + Math.random() * r.width) + 'px';
    el.style.top      = (r.top  + r.height * 0.4 + Math.random() * r.height * 0.4) + 'px';
    el.style.fontSize = (16 + Math.random() * 14) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3200);
    count++;
    setTimeout(spawnHeart, 180 + Math.random() * 220);
  }
  spawnHeart();
}

/* ═══════════════════════════════════════════════════════════
   SINCERE BUTTON
═══════════════════════════════════════════════════════════ */
document.getElementById('sincere-btn').addEventListener('click', function () {
  const card   = document.getElementById('card');
  const emojis = ['🩷','💗','💕','💖','🌸'];
  card.classList.add('glowing');
  const rect = this.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top  + rect.height / 2;
  for (let i = 0; i < 14; i++) {
    const el = document.createElement('span');
    el.className   = 'burst-heart';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const angle = (Math.PI * 2 / 14) * i;
    const dist  = 70 + Math.random() * 60;
    el.style.setProperty('--bx', (Math.cos(angle) * dist) + 'px');
    el.style.setProperty('--by', (Math.sin(angle) * dist) + 'px');
    el.style.left = cx + 'px';
    el.style.top  = cy + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }
  for (let j = 0; j < 12; j++) {
    setTimeout(() => {
      const fh    = document.createElement('span');
      fh.className   = 'float-heart';
      fh.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      fh.style.left  = (10 + Math.random() * 80) + 'vw';
      fh.style.top   = (30 + Math.random() * 40) + 'vh';
      fh.style.fontSize = (18 + Math.random() * 10) + 'px';
      document.body.appendChild(fh);
      setTimeout(() => fh.remove(), 3100);
    }, j * 160);
  }
  setTimeout(() => card.classList.remove('glowing'), 4500);
});

/* ═══════════════════════════════════════════════════════════
   INIT — runs on every page load
═══════════════════════════════════════════════════════════ */
initMusic(); // restore audio from IndexedDB (ready to play on open)
</script>
